spring.application.name=HM_Project

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_db_password

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api/v1
server.port=8085

jwt.secret=your_jwt_key
jwt.expiration=3600000

razorpay.key.id=your_razorpay_id
razorpay.key.secret=your_razorpay_key
razorpay.currency=INR
razorpay.business.name=your_business_name